<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeAreFSL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; scroll-behavior: smooth; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #0f0f0f, #111, #0a0a0a, #1a1a1a);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      color: #fff; line-height: 1.6;
      overflow-x: hidden;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Loader */
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0d0d0d; display: flex; align-items: center; justify-content: center;
      z-index: 2000; transition: opacity 0.5s ease;
    }
    .spinner {
      border: 5px solid #222; border-top: 5px solid #00ffff;
      border-radius: 50%; width: 60px; height: 60px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cursor styles */
    .cursor { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
    .cursor.glow { width: 25px; height: 25px; border: 2px solid #00ffff; border-radius: 50%; box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff66; }
    .cursor.crosshair { width: 30px; height: 30px; }
    .cursor.crosshair::before, .cursor.crosshair::after { content: ""; position: absolute; background: #00ffff; }
    .cursor.crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    .cursor.crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
    .cursor.circle { width: 35px; height: 35px; border: 2px solid #00ffff; border-radius: 50%; box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff88; }
    .cursor.pixel { width: 8px; height: 8px; background: #00ffff; image-rendering: pixelated; }
    .cursor.pulse { width: 20px; height: 20px; border-radius: 50%; background: #00ffff88; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(0.8); opacity: 0.7; } to { transform: scale(1.3); opacity: 1; } }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 50px; background: #111;
      position: sticky; top: 0; z-index: 1000;
      opacity: 0; transform: translateY(-20px);
      animation: fadeInDown 1s ease forwards; animation-delay: 0.5s;
    }
    header h1 { font-size: 1.6rem; font-weight: bold; letter-spacing: 1px; }
    nav a { color: #ccc; text-decoration: none; margin-left: 25px; transition: color 0.3s; font-weight: 500; }
    nav a:hover { color: #00ffff; }

    /* Hero */
    .hero { text-align: center; padding: 120px 20px 80px; opacity: 0; animation: fadeIn 1.2s ease forwards; animation-delay: 1s; }
    .hero h2 { font-size: 3.2rem; margin-bottom: 20px; }
    .hero p { font-size: 1.2rem; color: #aaa; margin-bottom: 35px; }
    .typing { border-right: 2px solid #00ffff; display: inline-block; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { border-color: transparent; } }
    .btn { background: #00ffff; color: #000; padding: 14px 35px; border-radius: 30px; font-weight: bold; text-decoration: none; transition: transform 0.3s, background 0.3s; display: inline-block; }
    .btn:hover { transform: scale(1.05); background: #00cccc; }

    /* Community */
    .discord { padding: 90px 20px; text-align: center; opacity: 0; transform: translateY(60px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .discord.visible { opacity: 1; transform: translateY(0); }
    .discord h2 { font-size: 2rem; margin-bottom: 20px; }
    .members { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
    .member { display: flex; align-items: center; gap: 12px; background: #1a1a1a; padding: 10px 15px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,255,0.1); transition: transform 0.3s, box-shadow 0.3s; opacity: 0; transform: translateY(20px); animation: fadeUp 1s ease forwards; }
    .member:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,255,255,0.3); }
    .member img { width: 36px; height: 36px; border-radius: 50%; }
    .member span { font-weight: 500; color: #eee; }

    /* Settings Panel */
    .settings-panel { display: none; position: fixed; top: 0; right: 0; width: 300px; height: 100%; background: #111; padding: 20px; z-index: 1500; box-shadow: -2px 0 10px rgba(0,255,255,0.2); animation: slideIn 0.5s ease forwards; }
    .settings-panel h2 { margin-bottom: 20px; }
    .settings-panel label { display: block; margin: 10px 0; cursor: pointer; }
    .settings-panel .close { position: absolute; top: 15px; right: 15px; font-size: 18px; color: #aaa; cursor: pointer; }

    /* Animations */
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }

  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader"><div class="spinner"></div></div>

  <!-- Cursor -->
  <div class="cursor glow" id="cursor"></div>

  <!-- HEADER -->
  <header>
    <h1>WeAreFSL</h1>
    <nav>
      <a href="https://discord.gg/xJdYjyNHZB" target="_blank">Download</a>
      <a href="#community" class="scroll">Community</a>
      <a href="https://pastebin.com/raw/SExHMhyU" target="_blank">Contacts</a>
      <a href="#" id="settingsBtn">Settings</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h2>WeAreFSL</h2>
    <p><span id="typing" class="typing"></span></p>
    <a href="https://discord.gg/xJdYjyNHZB" target="_blank" class="btn">Get Now</a>
  </section>

  <!-- DISCORD COMMUNITY -->
  <section class="discord" id="community">
    <h2>Community</h2>
    <p>Currently online on our Discord server:</p>
    <div class="members" id="members"></div>
  </section>

  <!-- SETTINGS PANEL -->
  <div class="settings-panel" id="settingsPanel">
    <span class="close" id="closeSettings">&times;</span>
    <h2>Settings</h2>
    <p>Select Cursor Style:</p>
    <label><input type="radio" name="cursor" value="glow" checked> Glow</label>
    <label><input type="radio" name="cursor" value="crosshair"> Crosshair</label>
    <label><input type="radio" name="cursor" value="circle"> Neon Circle</label>
    <label><input type="radio" name="cursor" value="pixel"> Pixel</label>
    <label><input type="radio" name="cursor" value="pulse"> Pulse</label>
  </div>

  <!-- FOOTER -->
  <footer>© 2025 WeAreFSL. All rights reserved.</footer>

  <script>
    // Cursor animation
    const cursor = document.getElementById("cursor");
    let cursorX = 0, cursorY = 0, mouseX = 0, mouseY = 0;
    document.addEventListener("mousemove", e => { mouseX = e.clientX; mouseY = e.clientY; });
    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Loader
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");
      if (sessionStorage.getItem("visited")) loader.style.display = "none";
      else {
        setTimeout(() => { loader.style.opacity = "0"; setTimeout(() => loader.style.display = "none", 500); }, 1500);
        sessionStorage.setItem("visited", "true");
      }
    });

    // Typing effect
    const text = "Good executor for Roblox, easy to use and fast.";
    let i = 0;
    function typing() {
      if (i < text.length) {
        document.getElementById("typing").textContent += text.charAt(i);
        i++; setTimeout(typing, 50);
      }
    } typing();

    // Smooth scroll + show community
    document.querySelectorAll("a.scroll").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const target = document.querySelector(link.getAttribute("href"));
        target.scrollIntoView({ behavior: "smooth" });
        setTimeout(() => target.classList.add("visible"), 400);
      });
    });

    // Fetch Discord members
    fetch("https://discord.com/api/guilds/1407757559292755988/widget.json")
      .then(res => res.json())
      .then(data => {
        const membersDiv = document.getElementById("members");
        if (data && data.members) {
          data.members.forEach((m, idx) => {
            const el = document.createElement("div");
            el.className = "member";
            el.style.animationDelay = `${idx * 0.05}s`;

            // fix avatar gif
            let avatar = m.avatar_url;
            if (avatar.includes("a_")) avatar = avatar.replace(".png", ".gif");

            el.innerHTML = `<img src="${avatar}" alt=""><span>${m.username}</span>`;
            membersDiv.appendChild(el);
          });
        } else {
          membersDiv.innerHTML = "<p>Widget is disabled. Enable it in Discord server settings.</p>";
        }
      });

    // Settings panel
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const closeSettings = document.getElementById("closeSettings");

    settingsBtn.addEventListener("click", e => {
      e.preventDefault();
      settingsPanel.style.display = "block";
    });
    closeSettings.addEventListener("click", () => {
      settingsPanel.style.display = "none";
    });

    document.querySelectorAll("input[name='cursor']").forEach(radio => {
      radio.addEventListener("change", e => {
        cursor.className = "cursor " + e.target.value;
      });
    });
  </script>
</body>
</html>
