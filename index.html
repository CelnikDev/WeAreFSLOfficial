<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeAreFSL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: #111;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: bold;
    }
    nav a {
      color: #ccc;
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #fff;
    }
    .hero {
      text-align: center;
      padding: 100px 20px 60px;
      background: linear-gradient(to bottom, #111, #0d0d0d);
    }
    .hero h2 {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    .hero p {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 30px;
    }
    .btn {
      background: #fff;
      color: #000;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.3s, background 0.3s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #ddd;
    }
    .version {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #888;
    }
    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 60px 20px;
    }
    .card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;
      width: 250px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .card h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }
    .card p {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>WeAreFSL</h1>
    <nav>
      <a href="#">Download</a>
      <a href="#">Preview</a>
      <a href="#">API</a>
      <a href="#">Contacts</a>
    </nav>
  </header>

  <section class="hero">
    <h2>WeAreFSL</h2>
    <p>Good executor for Roblox, easy to use and fast.</p>
    <a href="#" class="btn">Download now</a>
    <div class="version">Current Version: 2.5.1</div>
  </section>

  <section class="features">
    <div class="card">
      <h3>Paid</h3>
      <p>Premium access with full features unlocked.</p>
    </div>
    <div class="card">
      <h3>100% Safe</h3>
      <p>Does not contain malware.</p>
    </div>
    <div class="card">
      <h3>High UNC</h3>
      <p>99% UNC</p>
    </div>
  </section>
</body>
</html>
