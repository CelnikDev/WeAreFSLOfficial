<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remakes Executor</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    /* Canvas jako tło */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
    }

    /* Overlay z gradientem */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(270deg,#0a0a0a,#1a1a1a,#0f0f0f);
      background-size: 600% 600%;
      animation: gradient 15s ease infinite;
      z-index: -1;
    }
    @keyframes gradient {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Główna zawartość */
    .container {
      text-align: center;
      position: relative;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    }
    .logo span { color: #ff00ff; }

    .subtitle {
      font-size: 1.2rem;
      color: #bbb;
      margin-bottom: 2rem;
    }

    /* Przyciski */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 999px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 0 10px #000;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: scale(1.1);
      background: #2a2a2a;
      box-shadow: 0 0 20px #0ff, 0 0 40px #00f;
    }

    /* Główny przycisk */
    .btn.main {
      margin-top: 1.5rem;
      background: linear-gradient(90deg,#00f,#0ff);
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 0 25px #0ff, 0 0 50px #00f;
    }
    .btn.main:hover {
      background: linear-gradient(90deg,#ff00ff,#0ff);
      box-shadow: 0 0 40px #ff00ff, 0 0 80px #0ff;
    }

    /* Fade-in */
    .fade-in { animation: fade 2s ease forwards; opacity: 0; }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="overlay"></div>

  <main class="container fade-in">
    <h1 class="logo">Remakes <span>Executor</span></h1>
    <p class="subtitle">The ultimate Roblox Executor experience</p>

    <div class="buttons">
      <a href="https://discord.gg/xJdYjyNHZB" target="_blank" class="btn">Join Discord</a>
      <a href="#" class="btn">Download</a>
      <a href="#" class="btn">Docs</a>
      <a href="#" class="btn">GitHub</a>
      <a href="https://discord.gg/xJdYjyNHZB" target="_blank" class="btn main">Get Executor</a>
    </div>
  </main>

  <script>
    // Particles
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        dx: (Math.random() - 0.5) * 2,
        dy: (Math.random() - 0.5) * 2,
        r: Math.random() * 2 + 1
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0ff";
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // Resize fix
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
